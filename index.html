<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mirador Frutal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: barra lateral de módulos + encabezado fijo con filtros globales; en teléfono la barra pasa a pestañas deslizables. */
:root{
  --bg:#f4f6f3; --surface:#ffffff; --surface-2:#eef2ed; --surface-3:#e4e9e3;
  --ink:#111915; --ink-2:#4a5650; --muted:#7d8781; --line:#dce2db; --line-2:#c9d1c8;
  --accent:#1d4d3a; --accent-ink:#ffffff; --accent-soft:#dcebe2; --accent-text:#1d4d3a;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --o1:#86b6ef; --o2:#5598e7; --o3:#2a78d6; --o4:#1c5cab; --o5:#104281; --o6:#0d366b; --o0:#b7d3f6;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --good-ink:#006300; --warn-ink:#8a5a00; --crit-ink:#b42f2f; --info-ink:#1c5cab;
  --good-soft:#dcf2dc; --warn-soft:#fcefd0; --crit-soft:#f8dede; --info-soft:#dde9f8;
  --shadow:0 1px 2px rgba(17,25,21,.06),0 8px 24px rgba(17,25,21,.08);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1210; --surface:#161b18; --surface-2:#1c231f; --surface-3:#242c27;
  --ink:#ecf0ed; --ink-2:#b6c0ba; --muted:#848e88; --line:#28302b; --line-2:#353f39;
  --accent:#8fd1ad; --accent-ink:#0e1210; --accent-soft:#1e3a2c; --accent-text:#8fd1ad;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --o1:#184f95; --o2:#1c5cab; --o3:#2a78d6; --o4:#3987e5; --o5:#6da7ec; --o6:#9ec5f4; --o0:#104281;
  --good-ink:#2fc22f; --warn-ink:#fab219; --crit-ink:#f07a7a; --info-ink:#86b6ef;
  --good-soft:#173317; --warn-soft:#3a2e12; --crit-soft:#3d1e1e; --info-soft:#172a42;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1210; --surface:#161b18; --surface-2:#1c231f; --surface-3:#242c27;
  --ink:#ecf0ed; --ink-2:#b6c0ba; --muted:#848e88; --line:#28302b; --line-2:#353f39;
  --accent:#8fd1ad; --accent-ink:#0e1210; --accent-soft:#1e3a2c; --accent-text:#8fd1ad;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --o1:#184f95; --o2:#1c5cab; --o3:#2a78d6; --o4:#3987e5; --o5:#6da7ec; --o6:#9ec5f4; --o0:#104281;
  --good-ink:#2fc22f; --warn-ink:#fab219; --crit-ink:#f07a7a; --info-ink:#86b6ef;
  --good-soft:#173317; --warn-soft:#3a2e12; --crit-soft:#3d1e1e; --info-soft:#172a42;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:6px}
.ic{flex:none;display:block}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px}

/* Encabezado */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px;display:block;line-height:1.2}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel{position:relative}
.sel select{appearance:none;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 30px 7px 10px;font-size:13px;max-width:210px}
.sel::after{content:"";position:absolute;right:11px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--ink-2);border-bottom:1.6px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.iconbtn{position:relative;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--crit);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;border:2px solid var(--surface)}
.badge[hidden]{display:none!important}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-family:var(--f-display);font-weight:700;font-size:15px}
.demo-bar{background:var(--accent-soft);color:var(--accent-text);font-size:12.5px;text-align:center;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}

/* Estructura */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 100px)}
.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 10px;position:sticky;top:calc(61px + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - 61px);overflow:auto;padding-left:max(10px,env(safe-area-inset-left,0px))}
.side h6{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 10px 6px;font-weight:600}
.side h6:first-child{margin-top:0}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-align:left;font-size:14px}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.nav .cnt{margin-left:auto;font-size:11.5px;font-weight:600;background:var(--crit-soft);color:var(--crit-ink);padding:1px 7px;border-radius:9px}
.nav .tag{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--line-2);padding:0 6px;border-radius:6px}
.side-foot{margin:18px 10px 0;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:6px}
.sync{display:flex;align-items:center;gap:7px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none;box-shadow:0 0 0 3px var(--good-soft)}
main{min-width:0;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:18px}

@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:calc(var(--toph,108px) + env(safe-area-inset-top,0px));z-index:40;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .side h6,.side-foot{display:none}
  .nav{width:auto;white-space:nowrap;padding:7px 11px;font-size:13px}
  .nav .tag{display:none}
  .brand small{display:none}
}
@media (max-width:560px){
  .filters{width:100%;order:3}
  .sel{flex:1 1 40%}
  .sel select{width:100%;max-width:none}
}

/* Encabezado de vista */
.vhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
h1{font-family:var(--f-display);font-size:clamp(24px,3vw,32px);line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--ink-2);max-width:68ch}
h2{font-family:var(--f-display);font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:14px;margin:0;font-weight:600}
.src{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:20px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.src::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--s3)}
.src.new::before{background:var(--s2)}
.src.mix::before{background:var(--s1)}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.card-h p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:18px}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-kpi.k6{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1180px){.g-kpi,.g-kpi.k6{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g-kpi,.g-kpi.k6{grid-template-columns:minmax(0,1fr)}}
.g-2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-halves{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3>.span-all{grid-column:1/-1}}
@media (max-width:1180px){.g-2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.g-3,.g-halves{grid-template-columns:minmax(0,1fr)}}

.kpi{display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px}
.kpi .lbl{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .val{font-family:var(--f-display);font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.kpi .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);min-height:28px}
.up{color:var(--good-ink);font-weight:600}
.down{color:var(--crit-ink);font-weight:600}
.flat{color:var(--warn-ink);font-weight:600}
.kpi.alert{border-color:var(--crit);box-shadow:inset 3px 0 0 var(--crit)}

/* Pastillas de estado */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill svg{width:13px;height:13px}
.p-good{background:var(--good-soft);color:var(--good-ink)}
.p-warn{background:var(--warn-soft);color:var(--warn-ink)}
.p-crit{background:var(--crit-soft);color:var(--crit-ink)}
.p-info{background:var(--info-soft);color:var(--info-ink)}
.p-mute{background:var(--surface-2);color:var(--ink-2)}

/* Chips de filtro */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:12.5px;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}

/* Tablas */
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th.r,td.r{text-align:right}
td.r,td.num{white-space:nowrap}
th button{border:0;background:none;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
th button[aria-sort]{color:var(--ink)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:var(--surface-2)}
td .sub{display:block;color:var(--muted);font-size:12px}
.cl-name{font-weight:600}
.act-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.act-btn:hover{border-color:var(--ink-2);color:var(--ink)}

/* Barras HTML */
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(78px,140px) minmax(60px,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar-row .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.bar-track{height:12px;position:relative}
.bar-fill{height:100%;border-radius:0 4px 4px 0;background:var(--s1);min-width:2px}
.bar-row .bv{font-variant-numeric:tabular-nums;font-weight:600;min-width:72px;text-align:right}
.bar-row .bv small{color:var(--muted);font-weight:400;display:block;font-size:11px;line-height:1.2}

.stack{display:flex;gap:2px;height:22px;border-radius:5px;overflow:hidden}
.stack span{display:block;height:100%;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .ln{width:16px;height:0;border-top:2px solid;border-radius:0;vertical-align:3px}
.legend .ln.dash{border-top-style:dashed}

/* Gráficos */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .lbl-strong{fill:var(--ink);font-weight:600;font-size:12px}
.grid-l{stroke:var(--line);stroke-width:1}
.base-l{stroke:var(--line-2);stroke-width:1}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12.5px;min-width:140px;max-width:280px}
#tip b{display:block;margin-bottom:4px;font-size:12px}
#tip .tr{display:flex;align-items:center;gap:8px;justify-content:space-between}
#tip .tr span{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
#tip .tr i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* Listas */
.list{display:grid}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li:first-child{padding-top:2px}
.sev{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.sev-crit{background:var(--crit-soft);color:var(--crit-ink)}
.sev-warn{background:var(--warn-soft);color:var(--warn-ink)}
.sev-good{background:var(--good-soft);color:var(--good-ink)}
.sev-info{background:var(--info-soft);color:var(--info-ink)}
.li h4{overflow-wrap:anywhere;margin:0;font-size:13.5px;font-weight:600;line-height:1.35}
.li p{margin:2px 0 0;color:var(--ink-2);font-size:12.5px}
.li .meta{font-size:11.5px;color:var(--muted);white-space:nowrap}
.linkbtn{border:0;background:none;padding:0;color:var(--accent-text);font-weight:600;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px}

/* Mapa de recompra */
.heat{border-collapse:separate;border-spacing:3px;font-size:12px;width:auto;min-width:100%}
.heat th{font-size:11px;text-transform:none;letter-spacing:0;padding:4px;border:0;color:var(--ink-2);font-weight:500;vertical-align:bottom}
.heat th.rot{height:96px;white-space:nowrap;width:40px}
.heat th.rot div{transform:rotate(-50deg);transform-origin:left bottom;width:24px;margin-left:18px}
.heat td{border:0;padding:0;text-align:center;width:40px;height:30px;border-radius:5px;font-variant-numeric:tabular-nums}
.heat td.nm{text-align:left;padding:0 10px 0 0;width:auto;white-space:nowrap;font-weight:500;position:sticky;left:0;background:var(--surface);z-index:1}
.heat td.nm small{color:var(--muted);font-weight:400;margin-left:6px}
.heat tbody tr:hover td{background:inherit}
.heat tbody tr:hover td.nm{background:var(--surface)}
.hc-ok{background:var(--surface-2);color:var(--ink-2)}
.hc-late{background:var(--warn-soft);color:var(--warn-ink);font-weight:600}
.hc-crit{background:var(--crit-soft);color:var(--crit-ink);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--crit)}
.hc-none{color:var(--line-2)}

/* Notificaciones */
.pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);min-width:200px}
.menu{padding:6px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;font-size:13px}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.menu .danger{color:var(--crit-ink)}
.npanel{width:min(400px,calc(100vw - 24px));max-height:min(620px,calc(100vh - 90px));display:flex;flex-direction:column}
.npanel-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.npanel-b{overflow:auto;padding:0 16px}
.npanel-f{border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between}
.ni{position:relative}
.ni.unread h4::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--s1);margin-left:7px;vertical-align:2px}
.group-t{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:12px 0 2px}
#toasts{position:fixed;z-index:95;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;gap:10px;width:min(380px,calc(100vw - 32px))}
.toast{background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--shadow);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;animation:tin .28s ease-out}
.toast h4{margin:0;font-size:13.5px}
.toast p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.toast .x{border:0;background:none;color:var(--muted);padding:2px}
@keyframes tin{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

/* Reglas */
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule h4{margin:0;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rule p{margin:3px 0 0;color:var(--ink-2);font-size:13px}
.rule .cond{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink-2)}
.rule .cond input{width:64px;border:1px solid var(--line-2);border-radius:6px;padding:3px 6px;background:var(--surface-2);text-align:center}
.rule .who{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.who span{font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--ink-2)}
.chans{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chan{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line-2);border-radius:7px;padding:3px 9px;color:var(--ink-2);background:var(--surface)}
.chan input{margin:0;accent-color:var(--accent)}
.sw{position:relative;width:40px;height:22px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:12px;background:var(--surface-3);transition:background .15s}
.sw span::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--s1);outline-offset:2px}
.rule-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}

/* Teléfono de vista previa */
.phone{max-width:340px;margin:0 auto;border:1px solid var(--line-2);border-radius:26px;padding:12px;background:var(--surface-2)}
.phone-h{display:flex;align-items:center;gap:10px;padding:6px 6px 12px;border-bottom:1px solid var(--line)}
.phone-h .logo{width:30px;height:30px;border-radius:50%}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;margin-top:12px;font-size:13px;line-height:1.45;white-space:pre-line}
.bubble .t{display:block;text-align:right;font-size:11px;color:var(--muted);margin-top:4px}

/* Secuencia */
.seq{display:grid;gap:0;position:relative}
.step{display:grid;grid-template-columns:64px 18px minmax(0,1fr);gap:10px;align-items:start;padding-bottom:16px;position:relative}
.step .when{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);text-align:right;padding-top:1px}
.step .nd{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);margin-top:4px;position:relative;z-index:1}
.step:not(:last-child)::before{content:"";position:absolute;left:79px;top:18px;bottom:0;width:2px;background:var(--line)}
.step h4{margin:0;font-size:13.5px}
.step p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}

/* Flujo */
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.fnode{flex:1 1 150px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.fnode b{display:block;font-size:13px}
.fnode span{font-size:12px;color:var(--ink-2)}
.farrow{display:grid;place-items:center;width:28px;color:var(--muted);flex:none}
@media (max-width:700px){.flow{flex-direction:column}.farrow{width:100%;height:24px;transform:rotate(90deg)}}

/* Canales */
.chat{display:grid;grid-template-columns:220px minmax(0,1fr) 260px;min-height:480px;padding:0;overflow:hidden}
.chat-l{border-right:1px solid var(--line);padding:12px 8px;background:var(--surface-2)}
.chat-l button{display:flex;width:100%;border:0;background:none;padding:7px 10px;border-radius:7px;font-size:13.5px;color:var(--ink-2);text-align:left}
.chat-l button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600}
.chat-l button .cnt{margin-left:auto;font-size:11px;background:var(--s1);color:#fff;border-radius:9px;padding:0 6px;font-weight:600}
.chat-m{padding:14px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.msg{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px}
.msg .av{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent-text)}
.msg b{font-size:13px}
.msg time{font-size:11.5px;color:var(--muted);margin-left:6px;font-family:var(--f-mono)}
.msg p{margin:2px 0 0;font-size:13.5px}
.file{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:6px;font-size:12.5px;background:var(--surface-2)}
.chat-r{border-left:1px solid var(--line);padding:14px;font-size:12.5px}
.chat-r h3{margin-bottom:10px}
.log{display:grid;gap:10px}
.log div{border-left:2px solid var(--line-2);padding-left:10px}
.log time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:block}
@media (max-width:1000px){.chat{grid-template-columns:180px minmax(0,1fr)}.chat-r{display:none}}
@media (max-width:640px){.chat{grid-template-columns:minmax(0,1fr)}.chat-l{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.chat-l button{white-space:nowrap;width:auto}}

.note{font-size:12.5px;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.split{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;background:var(--surface);min-width:0;flex:0 1 260px;color:var(--muted)}
.search input{border:0;background:transparent;outline:0;width:100%;color:var(--ink);font-size:13px}
.big-n{font-family:var(--f-display);font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1}
.days{font-family:var(--f-display);font-weight:700}
.eta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
.eta:last-child{border-bottom:0}
.eta-track{grid-column:1/-1;height:6px;background:var(--surface-3);border-radius:4px;overflow:hidden}
.eta-track span{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.doc-chips{display:flex;flex-wrap:wrap;gap:5px}
.feas td:first-child{font-weight:600}
</style>
</head>

(function(){

/* ============ Render ============ */
var current=null;
function render(){
  if(!V[state.view])state.view="resumen";
  renderSide();
  var v=V[state.view]();current=v;
  $("#view").innerHTML=v.html;
  if(v.after)v.after();
  $$('.seg button[data-act="moneda"]').forEach(function(b){b.setAttribute("aria-pressed",b.dataset.v===state.moneda);});
}
function go(view){state.view=view;closePop();try{history.replaceState(null,"","#"+view);}catch(e){}render();window.scrollTo(0,0);}
var rt;new ResizeObserver(function(){clearTimeout(rt);rt=setTimeout(function(){if(current&&current.after&&$(".chart"))current.after();},160);}).observe($("#main"));
function setTopH(){document.documentElement.style.setProperty("--toph",$("#top").offsetHeight+"px");}
new ResizeObserver(setTopH).observe($("#top"));

/* ============ Menús emergentes ============ */
var pop=null;
function closePop(){if(pop){pop.remove();pop=null;}}
function openPop(anchor,html,cls){closePop();pop=document.createElement("div");pop.className="pop "+(cls||"menu");pop.innerHTML=html;document.body.appendChild(pop);
  var rc=anchor.getBoundingClientRect(),w=pop.offsetWidth,hh=pop.offsetHeight;var left=Math.min(Math.max(8,rc.right-w),innerWidth-w-8),top=rc.bottom+6;if(top+hh>innerHeight-8)top=Math.max(8,rc.top-hh-6);pop.style.left=left+"px";pop.style.top=top+"px";var f=pop.querySelector("button");if(f)f.focus({preventScroll:true});}
function mi(icn,label,msg,cls){return'<button data-act="do" data-msg="'+h(msg)+'"'+(cls?' class="'+cls+'"':"")+'>'+ic(icn,16)+h(label)+'</button>';}
var MENUS={
 cobro:function(c){return mi("send","Enviar recordatorio por WhatsApp","Recordatorio enviado a "+c.n+" por WhatsApp")+mi("file","Enviar estado de cuenta por correo","Estado de cuenta enviado a "+c.n)+mi("clock","Registrar promesa de pago","Promesa de pago registrada para "+c.n)+mi("users","Asignar llamada al vendedor","Tarea creada para "+c.vend)+'<hr>'+mi("alert","Retener pedidos a crédito","Pedidos a crédito de "+c.n+" retenidos","danger");},
 recompra:function(c){return mi("bell","Avisar al vendedor","Se avisó a "+c.vend+" por WhatsApp")+mi("send","Enviar oferta al cliente","Oferta enviada a "+c.n)+mi("chart","Ver historial de compras","Abriendo historial de "+c.n)+mi("x","Ignorar esta alerta por 7 días","Alerta pausada por 7 días");},
 cliente:function(c){return mi("chart","Ver historial de compras","Abriendo historial de "+c.n)+mi("wallet","Ver estado de cuenta","Abriendo estado de cuenta de "+c.n)+mi("send","Enviar mensaje","Mensaje enviado a "+c.n);},
 vend:function(n){return mi("users","Ver sus clientes","Filtrando clientes de "+n)+mi("send","Enviar su reporte del día","Reporte enviado a "+n);},
 inv:function(rid){var x=RB[rid];return mi("send","Ofertar a mayoristas","Oferta de "+x.n+" enviada a 8 mayoristas")+mi("box","Crear orden de compra","Borrador de orden de compra de "+x.n+" creado")+mi("bell","Avisar a despacho: sacar primero","Despacho notificado: sacar primero el lote más antiguo de "+x.n);},
 pago:function(p){return mi("check","Aprobar y abonar en Profit","Pago de "+p.cl+" abonado en Profit")+mi("msg","Pedir aclaratoria al cliente","Mensaje enviado a "+p.cl)+mi("file","Ver comprobante y correo del banco","Abriendo comprobante "+p.ref)+'<hr>'+mi("x","Rechazar pago","Pago de "+p.cl+" rechazado","danger");},
 flota:function(i){var f=FLOTA[i];return mi("file","Cargar documento renovado","Documento cargado para "+f.u)+mi("send","Avisar al chofer","Aviso enviado a "+f.chofer)+mi("truck","Ver historial de la unidad","Abriendo historial de "+f.u);}
};
function findById(kind,id){if(kind==="cobro"||kind==="recompra"||kind==="cliente")return CLIENTES.filter(function(c){return c.id===id;})[0];if(kind==="pago")return PAGOS.filter(function(p){return p.id===id;})[0];return id;}
function notifPanel(){
  var list=NOTIFS.slice().sort(function(a,b){return a.m-b.m;}),un=list.filter(function(n){return!n.read;}).length;
  return'<div class="npanel-h"><h2>Notificaciones</h2><span class="note">'+un+' sin leer</span></div><div class="npanel-b"><div class="list">'+list.slice(0,10).map(function(n){return notifLi(n);}).join("")+'</div></div><div class="npanel-f"><button class="linkbtn" data-act="readall">Marcar todas como leídas</button><button class="linkbtn" data-act="nav" data-view="notificaciones">Configurar avisos</button></div>';
}

/* ============ Avisos en vivo ============ */
function toast(n){var el=document.createElement("div");el.className="toast";el.innerHTML='<div class="sev sev-'+n.sev+'">'+ic(SEV_IC[n.sev],16)+'</div><div><h4>'+h(n.t)+'</h4>'+(n.b?'<p>'+h(n.b)+'</p>':"")+(n.id?'<button class="linkbtn" data-act="gonotif" data-id="'+n.id+'" style="margin-top:4px">Ver detalle</button>':"")+'</div><button class="x" aria-label="Cerrar">'+ic("x",15)+'</button>';
  $("#toasts").appendChild(el);el.querySelector(".x").onclick=function(){el.remove();};setTimeout(function(){el.remove();},7000);
  var all=$$("#toasts .toast");if(all.length>3)all[0].remove();}
var nid=100;
function pushNotif(n){n.id="n"+(nid++);n.m=0;n.read=false;NOTIFS.unshift(n);renderSide();toast(n);
  if(pop&&pop.classList.contains("npanel"))pop.innerHTML=notifPanel();
  if(state.view==="notificaciones"||state.view==="resumen"){var y=scrollY;render();scrollTo(0,y);}}
var liveI=0;
setTimeout(function tick(){if(liveI<LIVE.length){pushNotif(Object.assign({},LIVE[liveI++]));setTimeout(tick,45000);}},12000);
setInterval(function(){NOTIFS.forEach(function(n){n.m+=1;});},60000);

/* ============ Eventos ============ */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");
  if(!t){if(pop&&!e.target.closest(".pop"))closePop();return;}
  var a=t.dataset.act;
  if(a==="nav")return go(t.dataset.view);
  if(a==="moneda"){state.moneda=t.dataset.v;return render();}
  if(a==="chip"){state[t.dataset.g]=t.dataset.v;var y=scrollY;render();scrollTo(0,y);return;}
  if(a==="sort"){var k=t.dataset.k;if(state.sortK===k)state.sortD*=-1;else{state.sortK=k;state.sortD=(k==="n"||k==="vend")?1:-1;}return renderCobTable();}
  if(a==="bell"){if(pop&&pop.classList.contains("npanel"))return closePop();openPop(t,notifPanel(),"npanel");return;}
  if(a==="avatar"){if(pop&&pop.dataset.k==="av")return closePop();openPop(t,'<div style="padding:10px 12px 6px"><b>Ronald</b><div class="note">Dirección · acceso total</div></div><hr>'+mi("users","Mi perfil","Abriendo su perfil")+'<button data-act="nav" data-view="notificaciones">'+ic("bell",16)+'Preferencias de avisos</button>'+mi("plug","Usuarios y permisos","Abriendo usuarios y permisos")+'<hr>'+mi("x","Cerrar sesión","Esto es una demostración; la sesión sigue abierta","danger"));pop.dataset.k="av";return;}
  if(a==="rowmenu"){var kind=t.dataset.kind;openPop(t,MENUS[kind](findById(kind,t.dataset.id)));return;}
  if(a==="do"){closePop();toast({sev:"good",t:t.dataset.msg,b:"Acción simulada en esta demostración."});return;}
  if(a==="readall"){NOTIFS.forEach(function(n){n.read=true;});closePop();var y2=scrollY;render();scrollTo(0,y2);toast({sev:"good",t:"Todas las notificaciones quedaron leídas"});return;}
  if(a==="readnotif"||a==="gonotif"){var n=NOTIFS.filter(function(x){return x.id===t.dataset.id;})[0];if(n){n.read=true;if(a==="gonotif")return go(n.go);var y3=scrollY;render();scrollTo(0,y3);}return;}
  if(a==="testrule"){var rl=RULES.filter(function(x){return x.id===t.dataset.id;})[0];var chs=[rl.ch.app?"la app":"",rl.ch.wa?"WhatsApp":"",rl.ch.mail?"correo":""].filter(Boolean).join(", ");
    pushNotif({cat:rl.cat==="Resumen"?"Ventas":rl.cat,sev:rl.sev,t:"Prueba: "+rl.n,b:"Se enviaría a "+rl.who.join(", ")+" por "+(chs||"ningún canal")+".",go:"notificaciones"});return;}
  if(a==="canal"){state.canal=t.dataset.v;CANALES[state.canal][1]=0;return render();}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="f-emp"){state.emp=t.value;render();}
  else if(t.id==="f-sede"){state.sede=t.value;render();}
  else if(t.dataset.rule){var rl=RULES.filter(function(x){return x.id===t.dataset.rule;})[0];rl.on=t.checked?1:0;toast({sev:t.checked?"good":"info",t:(t.checked?"Regla activada: ":"Regla pausada: ")+rl.n});}
  else if(t.dataset.rch){var r2=RULES.filter(function(x){return x.id===t.dataset.rch;})[0];r2.ch[t.dataset.ch]=t.checked?1:0;}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closePop();if(e.key==="Enter"&&e.target.id==="chat-in"&&e.target.value.trim()){toast({sev:"good",t:"Mensaje publicado en #"+CANALES[state.canal][0],b:e.target.value.trim()});e.target.value="";}});
addEventListener("scroll",function(){if(pop&&!pop.classList.contains("npanel"))closePop();hideTip();},{passive:true});

var hs=(location.hash||"").replace("#","");if(V[hs])state.view=hs;
addEventListener("hashchange",function(){var x=(location.hash||"").replace("#","");if(V[x]&&x!==state.view)go(x);});
setTopH();render();
})();
